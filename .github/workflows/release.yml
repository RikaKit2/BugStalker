name: Release Prebuilt Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v0.4.9)'
        required: false
        default: 'v0.4.9'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Linux x86_64 Release Binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "val=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cargo Build Release
        run: |
          cargo build --release
          strip target/release/bs

      - name: Package Artifact
        run: |
          TAG="${{ steps.tag.outputs.val }}"
          mkdir -p dist
          tar -czvf "dist/bugstalker-${TAG}-x86_64-unknown-linux-gnu.tar.gz" -C target/release bs
          cd dist
          sha256sum "bugstalker-${TAG}-x86_64-unknown-linux-gnu.tar.gz" > "bugstalker-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          files: |
            dist/bugstalker-*.tar.gz
            dist/bugstalker-*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
